[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homeassistant-stiebeleltron-scraper-plugin"
version = "0.1.0"
description = "Home Assistant custom integration for Stiebel Eltron ISG Sensory Data READONLY"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
  {name = "Simon Hugentobler"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "beautifulsoup4>=4.12.0",
  "coverage[toml]>=7.6.0,<7.7.0",
  "homeassistant==2025.1.4",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "pytest-homeassistant-custom-component==0.13.205",
  "ruff>=0.8.0,<0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "ASYNC",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]
